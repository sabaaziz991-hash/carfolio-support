name: Publish Israel vehicle snapshot

on:
  workflow_dispatch:
  schedule:
    # Ministry resources currently refresh around 03:30 UTC. Requesting 05:30
    # keeps the build after that window; GitHub queues scheduled runs, so they
    # have actually started between about 09:30 and 12:00 UTC.
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: carfolio-israel-vehicle-snapshot
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Standard runners are free for public repositories. Do not change this to
    # a larger runner or make the repository private without reviewing billing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test snapshot builder
        run: python3 -m unittest discover -s tests -v

      - name: Build official passenger and heavy-vehicle snapshot
        run: >-
          python3 scripts/build_israel_vehicle_snapshot.py
          --minimum-passenger-records 3000000
          --minimum-heavy-records 300000
          --maximum-output-bytes 900000000

      - name: Verify mixed-registry manifest
        run: >-
          python3 -c 'import json;
          m=json.load(open("data/israel-vehicles/v2/manifest.json"));
          assert m["schemaVersion"] == 2;
          assert m["recordEncoding"] == "ordered-json-arrays";
          assert m["compression"] == "zlib";
          assert m["platePrefixLength"] == 2;
          assert m["shardCount"] <= 999;
          assert {s["registry"] for s in m["sources"]} == {"passenger", "heavy"};
          assert m["outputBytes"] <= 900000000;
          print(m["recordCount"], m["shardCount"], m["outputBytes"])'

      - name: Verify every shard decodes and matches the manifest
        run: |
          python3 - <<'EOF'
          import json, pathlib, zlib
          root = pathlib.Path("data/israel-vehicles/v2")
          manifest = json.loads((root / "manifest.json").read_text())
          shards = sorted(root.glob("shards/*.json.zlib"))
          assert len(shards) == manifest["shardCount"], (len(shards), manifest["shardCount"])
          total = 0
          for path in shards:
              shard = json.loads(zlib.decompress(path.read_bytes()))
              assert shard["schemaVersion"] == manifest["schemaVersion"], path.name
              assert shard["generatedAt"] == manifest["generatedAt"], path.name
              passenger = shard["passengerRecords"]
              heavy = shard["heavyRecords"]
              assert isinstance(passenger, list) and isinstance(heavy, list), path.name
              prefix = path.name.split(".")[0]
              for record in passenger + heavy:
                  assert str(record[0])[:2] == prefix, (path.name, record[0])
              total += len(passenger) + len(heavy)
          assert total == manifest["recordCount"], (total, manifest["recordCount"])
          print(f"verified {len(shards)} shards, {total:,} records")
          EOF

      - name: Create draft data release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="israel-vehicles-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          gh release create "${tag}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Israel vehicle registry snapshot ${tag#israel-vehicles-}" \
            --notes "Field-minimized official Israel Ministry of Transport passenger and heavy-vehicle registry snapshot for Carvetted fallback lookup."

      - name: Upload compact data assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag }}"
          data/israel-vehicles/v2/manifest.json
          data/israel-vehicles/v2/shards/*.json.zlib

      - name: Publish as latest snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${{ steps.release.outputs.tag }}"
          --draft=false
          --latest

      - name: Keep the newest two data releases
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            // GitHub sets created_at to the target commit's date, so every
            // snapshot built from the same commit ties. Release IDs increase
            // monotonically, which orders snapshots by when they were made.
            const snapshots = releases
              .filter(release => !release.draft && release.tag_name.startsWith("israel-vehicles-"))
              .sort((a, b) => b.id - a.id);
            for (const release of snapshots.slice(2)) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                core.warning(`Could not remove tag ${release.tag_name}: ${error.message}`);
              }
            }
            // A run that fails between draft creation and publication leaves
            // its draft behind; this run's own draft is already published.
            // Age comes from the build timestamp in the tag
            // (israel-vehicles-YYYYMMDD-HHMMSS-<run>), not created_at.
            const staleBefore = Date.now() - 48 * 60 * 60 * 1000;
            const builtAt = tag => {
              const match = /^israel-vehicles-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-/.exec(tag);
              return match
                ? Date.UTC(+match[1], +match[2] - 1, +match[3], +match[4], +match[5], +match[6])
                : Number.NaN;
            };
            const staleDrafts = releases.filter(release =>
              release.draft
                && release.tag_name.startsWith("israel-vehicles-")
                && builtAt(release.tag_name) < staleBefore
            );
            for (const release of staleDrafts) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              core.info(`Removed stale draft ${release.tag_name}`);
            }
