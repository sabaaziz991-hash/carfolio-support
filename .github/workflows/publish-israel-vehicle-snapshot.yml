name: Publish Israel vehicle snapshot

on:
  workflow_dispatch:
  schedule:
    # Ministry resources currently refresh around 03:30 UTC. Build after that
    # window so the release is not needlessly one day behind.
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: carfolio-israel-vehicle-snapshot
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Standard runners are free for public repositories. Do not change this to
    # a larger runner or make the repository private without reviewing billing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test snapshot builder
        run: python3 -m unittest discover -s tests -v

      - name: Build official passenger and heavy-vehicle snapshot
        run: >-
          python3 scripts/build_israel_vehicle_snapshot.py
          --minimum-passenger-records 3000000
          --minimum-heavy-records 300000
          --maximum-output-bytes 900000000

      - name: Verify mixed-registry manifest
        run: >-
          python3 -c 'import json;
          m=json.load(open("data/israel-vehicles/v2/manifest.json"));
          assert m["schemaVersion"] == 2;
          assert m["recordEncoding"] == "ordered-json-arrays";
          assert m["compression"] == "zlib";
          assert m["platePrefixLength"] == 2;
          assert m["shardCount"] <= 999;
          assert {s["registry"] for s in m["sources"]} == {"passenger", "heavy"};
          assert m["outputBytes"] <= 900000000;
          print(m["recordCount"], m["shardCount"], m["outputBytes"])'

      - name: Create draft data release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="israel-vehicles-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          gh release create "${tag}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Israel vehicle registry snapshot ${tag#israel-vehicles-}" \
            --notes "Field-minimized official Israel Ministry of Transport passenger and heavy-vehicle registry snapshot for Carfolio fallback lookup."

      - name: Upload compact data assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag }}"
          data/israel-vehicles/v2/manifest.json
          data/israel-vehicles/v2/shards/*.json.zlib

      - name: Publish as latest snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${{ steps.release.outputs.tag }}"
          --draft=false
          --latest

      - name: Keep the newest two data releases
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const snapshots = releases
              .filter(release => !release.draft && release.tag_name.startsWith("israel-vehicles-"))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of snapshots.slice(2)) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                core.warning(`Could not remove tag ${release.tag_name}: ${error.message}`);
              }
            }
